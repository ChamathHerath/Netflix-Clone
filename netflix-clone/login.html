<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Netflix - Sign In</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="login-page">

    <!-- HEADER -->

    <header class="login-header">

        <a
            href="index.html"
            class="login-logo"
        >
            NETFLIX
        </a>

    </header>


    <!-- LOGIN CONTAINER -->

    <main class="login-container">

        <div class="login-box">

            <h1>
                Sign In
            </h1>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <!-- EMAIL -->

                <div class="input-group">

                    <input
                        type="email"
                        id="email"
                        placeholder="Email or mobile number"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group password-group">

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="show-password"
                    >
                        Show
                    </button>

                </div>


                <!-- ERROR -->

                <p
                    id="loginError"
                    class="login-error"
                ></p>


                <!-- SIGN IN -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Sign In
                </button>


                <!-- OR -->

                <div class="login-or">
                    OR
                </div>


                <!-- CODE -->

                <button
                    type="button"
                    class="code-btn"
                >
                    Use a sign-in code
                </button>


                <!-- HELP -->

                <a
                    href="#"
                    class="forgot-password"
                >
                    Forgot password?
                </a>


                <!-- REMEMBER -->

                <label class="remember-me">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <!-- SIGN UP -->

                <div class="signup-text">

                    <span>
                        New to Netflix?
                    </span>

                    <a href="signup.html">
                        Sign up now.
                    </a>

                </div>


                <!-- INFORMATION -->

                <p class="login-info">

                    This page is protected by Google reCAPTCHA
                    to ensure you're not a bot.

                    <a href="#">
                        Learn more.
                    </a>

                </p>

            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="login-footer">

        <p>
            Questions? Contact us.
        </p>

        <div class="login-footer-links">

            <a href="#">
                FAQ
            </a>

            <a href="#">
                Help Center
            </a>

            <a href="#">
                Terms of Use
            </a>

            <a href="#">
                Privacy
            </a>

            <a href="#">
                Cookie Preferences
            </a>

        </div>

        <select class="language-select">

            <option>
                English
            </option>

            <option>
                Sinhala
            </option>

        </select>

    </footer>


    <script src="script.js"></script>

</body>

</html>
