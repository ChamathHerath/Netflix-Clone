<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo">NETFLIX</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Movies</a>
            <a href="#">TV Shows</a>
            <a href="#">My List</a>
        </nav>

        <button class="signin-btn">Sign In</button>
    </header>


    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">
            <h1>Stranger Things</h1>

            <p>
                When a young boy disappears, his friends discover
                mysterious secrets and supernatural events.
            </p>

            <button class="play-btn">▶ Play</button>
            <button class="info-btn">ⓘ More Info</button>
        </div>

    </section>


    <!-- Trending Section -->
    <section class="movies-section">

        <h2>Trending Now</h2>

        <div class="movie-container">

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/1XDDXPXGiI8id7MrUxK36ke7gkX.jpg">
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg">
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg">
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/5CemD1I8k1R0R7cK4yK6a5Q5y7A.jpg">
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/9f4g6tZ7L9k5M7r3G2d8N1xQ.jpg">
            </div>

        </div>

    </section>


    <!-- Popular Section -->
    <section class="movies-section">

        <h2>Popular Movies</h2>

        <div class="movie-container">

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/q719jXXEzOoYaps6babgKnONONX.jpg">
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg">
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg">
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/6ELCZlTA5lGUops70hKdB83WJxH.jpg">
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/9O1Iy9od7vL2q9T8w5s6x3j2.jpg">
            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 Netflix Clone | Created for Learning</p>
    </footer>

</body>
</html>
